<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Metallic Silver Gradients -->
    <linearGradient id="silver-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="silver-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="silver-facet-left" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="silver-facet-right" x1="100%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <!-- Electric Blue Illumination -->
    <linearGradient id="electric-blue" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0080FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0055FF" stop-opacity="1" />
    </linearGradient>
    <filter id="blue-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Electric Blue Ambient Illumination Backing -->
  <path d="M26 25 L199 365 L372 25 L290 85 L199 235 L110 85 Z"
        stroke="url(#electric-blue)" stroke-width="14" stroke-linejoin="round" filter="url(#blue-glow)" opacity="0.85" />

  <!-- Inner Electric Blue Core Accent -->
  <path d="M110 85 L199 235 L290 85 L260 85 L199 185 L140 85 Z" fill="url(#electric-blue)" opacity="0.9" />

  <!-- Left Metallic Blade (Outer Wing) -->
  <path d="M26 25 L85 95 L120 260 L199 365 L165 245 L110 85 Z" fill="url(#silver-left)" />

  <!-- Left Inner Facet -->
  <path d="M110 85 L165 245 L199 365 L199 235 Z" fill="url(#silver-facet-left)" />

  <!-- Right Metallic Blade (Outer Wing) -->
  <path d="M372 25 L315 95 L280 260 L199 365 L235 245 L290 85 Z" fill="url(#silver-right)" />

  <!-- Right Inner Facet -->
  <path d="M290 85 L235 245 L199 365 L199 235 Z" fill="url(#silver-facet-right)" />

  <!-- Center Highlight Ridge -->
  <line x1="199" y1="235" x2="199" y2="365" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
</svg>
